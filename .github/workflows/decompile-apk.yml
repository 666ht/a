name: Decompile APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.apk'
      - '**.zip'
      - '.github/workflows/decompile-apk.yml'

jobs:
  decompile:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip wget openjdk-17-jre-headless p7zip-full
          java -version

      - name: Locate APK
        shell: bash
        run: |
          set -e
          rm -rf work
          mkdir -p work/unpacked
          echo "Repository files:"
          find . -maxdepth 4 -type f -not -path './.git/*' -not -path './work/*' -print | sort
          echo "Archive inspection:"
          for f in $(find . -type f -iname '*.zip' -not -path './.git/*' -not -path './work/*'); do
            echo "===== $f ====="
            7z l "$f" | head -80 || true
          done

          find . -type f -not -path './.git/*' -not -path './work/*' -print0 |
          while IFS= read -r -d '' f; do
            if unzip -l "$f" >/dev/null 2>&1 &&
               unzip -l "$f" 2>/dev/null | grep -qE '(^|[[:space:]])AndroidManifest\.xml' &&
               unzip -l "$f" 2>/dev/null | grep -qE '(^|[[:space:]])classes([0-9]*)\.dex'; then
              printf '%s\n' "$f" > work/apk_path.txt
              break
            fi
          done

          for depth in 1 2 3; do
            find . -type f -iname '*.zip' -not -path './.git/*' -not -path './work/*' -print0 |
            while IFS= read -r -d '' z; do
              out="work/unpacked/d$depth/$(basename "$z" .zip)"
              mkdir -p "$out"
              7z x -y "$z" -o"$out" >/dev/null || true
            done

            if [ ! -s work/apk_path.txt ]; then
              find "work/unpacked/d$depth" -type f -print0 |
              while IFS= read -r -d '' f; do
                if unzip -l "$f" >/dev/null 2>&1 &&
                   unzip -l "$f" 2>/dev/null | grep -qE '(^|[[:space:]])AndroidManifest\.xml' &&
                   unzip -l "$f" 2>/dev/null | grep -qE '(^|[[:space:]])classes([0-9]*)\.dex'; then
                  printf '%s\n' "$f" > work/apk_path.txt
                  break
                fi
              done
            fi
            [ -s work/apk_path.txt ] && break
          done

          if [ ! -s work/apk_path.txt ]; then
            echo "No Android APK structure found."
            echo "The current repository does not contain the APK to decompile."
            exit 1
          fi

          APK="$(head -n 1 work/apk_path.txt)"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Using APK: $APK"
          ls -lh "$APK"

      - name: Install JADX
        run: |
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip -O /tmp/jadx.zip
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx
          sudo chmod +x /opt/jadx/bin/jadx
          /opt/jadx/bin/jadx --version

      - name: Install Apktool
        run: |
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/v2.9.3/scripts/linux/apktool -O /tmp/apktool
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /tmp/apktool.jar
          sudo install -m 755 /tmp/apktool /usr/local/bin/apktool
          sudo install -m 644 /tmp/apktool.jar /usr/local/bin/apktool.jar
          apktool --version

      - name: Decompile APK
        shell: bash
        run: |
          rm -rf decompiled
          mkdir -p decompiled/jadx decompiled/apktool decompiled/assets
          /opt/jadx/bin/jadx --show-bad-code --deobf -d decompiled/jadx "$APK" || true
          apktool d -f -o decompiled/apktool "$APK" || true
          unzip -p "$APK" assets/index.android.bundle > decompiled/assets/index.android.bundle 2>/dev/null || true
          unzip -p "$APK" assets/app.config > decompiled/assets/app.config 2>/dev/null || true
          printf 'APK=%s\n' "$APK" > decompiled/README.txt
          printf 'Generated by GitHub Actions using JADX and Apktool.\n' >> decompiled/README.txt

      - name: Package source
        run: |
          cd decompiled
          zip -qr ../decompiled-source.zip .
          cd ..
          ls -lh decompiled-source.zip

      - name: Upload decompiled source
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-source
          path: decompiled-source.zip
          if-no-files-found: error
          retention-days: 14
