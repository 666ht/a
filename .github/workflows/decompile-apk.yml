# Trigger a fresh installable-APK build
name: Decompile APK

on:
  workflow_dispatch:
  push:

jobs:
  decompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip wget zip openjdk-17-jre-headless
          java -version

      - name: Locate or reconstruct APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work/candidates work/reconstructed
          : > work/apk_path.txt

          echo "Repository files:"
          find . -maxdepth 5 -type f -not -path './.git/*' -not -path './work/*' -print | sort

          # 1) Prefer a real APK file.
          while IFS= read -r -d '' f; do
            if unzip -l "$f" 2>/dev/null | grep -qE '(^|[[:space:]])[^[:space:]]*/?AndroidManifest\.xml[[:space:]]*$' &&
               unzip -l "$f" 2>/dev/null | grep -qE '(^|[[:space:]])[^[:space:]]*/?classes([0-9]*)\.dex[[:space:]]*$'; then
              printf '%s\n' "$f" > work/apk_path.txt
              break
            fi
          done < <(find . -type f -iname '*.apk' -not -path './.git/*' -not -path './work/*' -print0)

          # 2) The current repository stores the APK as a ZIP whose contents
          #    are under a directory (123kt/AndroidManifest.xml, classes.dex, ...).
          #    Extract every ZIP and rebuild an APK from the directory that
          #    contains AndroidManifest.xml + classes*.dex.
          if [ ! -s work/apk_path.txt ]; then
            while IFS= read -r -d '' z; do
              base="$(basename "$z")"
              stem="${base%.*}"
              out="work/candidates/$stem"
              rm -rf "$out"
              mkdir -p "$out"
              unzip -q "$z" -d "$out"

              manifest="$(find "$out" -type f -name AndroidManifest.xml -print -quit)"
              if [ -z "$manifest" ]; then
                continue
              fi
              root="$(dirname "$manifest")"

              if find "$root" -maxdepth 1 -type f -regex '.*/classes[0-9]*\.dex' -print -quit | grep -q .; then
                reconstructed="work/reconstructed/recovered.apk"
                rm -f "$reconstructed"
                (
                  cd "$root"
                  zip -q -r "$GITHUB_WORKSPACE/$reconstructed" .
                )
                printf '%s\n' "$reconstructed" > work/apk_path.txt
                echo "Reconstructed APK from: $root"
                break
              fi
            done < <(find . -type f -iname '*.zip' -not -path './.git/*' -not -path './work/*' -print0)
          fi

          if [ ! -s work/apk_path.txt ]; then
            echo "::error::No APK structure found. Expected AndroidManifest.xml and classes*.dex."
            exit 1
          fi

          APK="$(head -n 1 work/apk_path.txt)"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Using APK: $APK"
          unzip -l "$APK" | grep -E 'AndroidManifest\.xml|classes([0-9]*)\.dex' | head -20 || true
          ls -lh "$APK"

      - name: Install JADX
        run: |
          set -euo pipefail
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip -O /tmp/jadx.zip
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx
          sudo chmod +x /opt/jadx/bin/jadx
          /opt/jadx/bin/jadx --version

      - name: Install Apktool
        run: |
          set -euo pipefail
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/v2.9.3/scripts/linux/apktool -O /tmp/apktool
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /tmp/apktool.jar
          sudo install -m 755 /tmp/apktool /usr/local/bin/apktool
          sudo install -m 644 /tmp/apktool.jar /usr/local/bin/apktool.jar
          apktool --version

      - name: Decompile APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf decompiled
          mkdir -p decompiled/jadx decompiled/apktool decompiled/assets

          /opt/jadx/bin/jadx --show-bad-code --deobf -d decompiled/jadx "$APK" || true
          apktool d -f -o decompiled/apktool "$APK" || true

          unzip -p "$APK" assets/index.android.bundle > decompiled/assets/index.android.bundle 2>/dev/null || true
          unzip -p "$APK" assets/app.config > decompiled/assets/app.config 2>/dev/null || true

          printf 'APK=%s\n' "$APK" > decompiled/README.txt
          printf 'Generated by GitHub Actions using JADX and Apktool.\n' >> decompiled/README.txt

      - name: Build installable APK container
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/opt/android-sdk}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          AAPT2="$BT/aapt2"
          ZIPALIGN="$BT/zipalign"
          APKSIGNER="$BT/apksigner"
          ANDROID_JAR="$(find "$SDK/platforms" -mindepth 2 -maxdepth 2 -name android.jar | sort -V | tail -1)"
          test -x "$AAPT2"; test -x "$ZIPALIGN"; test -x "$APKSIGNER"; test -s "$ANDROID_JAR"

          rm -rf work/final work/original work/res work/compiled
          mkdir -p work/final work/original work/res/values work/compiled/flat
          unzip -q "$APK" -d work/original

          cat > work/final/manifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.kkb.eg.android.AlipayGphone"
              android:versionCode="1"
              android:versionName="10.7.30.8000">
              <uses-sdk android:minSdkVersion="25" android:targetSdkVersion="35" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:name="com.kkb.eg.android.AlipayGphone.MainApplication"
                  android:label="AlipayGphone"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:extractNativeLibs="false">
                  <activity
                      android:name="com.kkb.eg.android.AlipayGphone.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > work/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">AlipayGphone</string></resources>
          EOF
          "$AAPT2" compile work/res/values/strings.xml -o work/compiled/flat
          FLAT="$(find work/compiled/flat -type f -name '*.arsc.flat' -print -quit)"
          test -s "$FLAT"
          "$AAPT2" link --manifest work/final/manifest.xml --min-sdk-version 25 --target-sdk-version 35 --version-code 1 --version-name 10.7.30.8000 --auto-add-overlay -I "$ANDROID_JAR" -R "$FLAT" -o work/final/base.apk
          unzip -qo work/final/base.apk AndroidManifest.xml resources.arsc -d work/final
          test -s work/final/AndroidManifest.xml
          test -s work/final/resources.arsc

          cp work/original/classes.dex work/final/
          cp work/original/classes2.dex work/final/
          cp work/original/classes3.dex work/final/
          cp -a work/original/assets work/final/ 2>/dev/null || true
          cp -a work/original/lib work/final/ 2>/dev/null || true
          cp -a work/original/kotlin work/final/ 2>/dev/null || true
          rm -rf work/final/base.apk work/final/manifest.xml work/final/META-INF
          (cd work/final && zip -qr ../../work/rebuilt-unsigned.apk .)
          "$ZIPALIGN" -f 4 work/rebuilt-unsigned.apk work/rebuilt-aligned.apk
          keytool -genkeypair -v -keystore work/rebuild.keystore -storepass android -keypass android -alias rebuildkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=666ht-rebuild,O=666ht,C=JP' >/dev/null 2>&1
          "$APKSIGNER" sign --ks work/rebuild.keystore --ks-pass pass:android --key-pass pass:android --out rebuilt-app.apk work/rebuilt-aligned.apk
          "$APKSIGNER" verify --verbose rebuilt-app.apk
          unzip -t rebuilt-app.apk >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,struct
          p=Path('rebuilt-app.apk')
          with zipfile.ZipFile(p) as z:
              m=z.read('AndroidManifest.xml')
              if len(m) < 8 or struct.unpack_from('<H', m, 0)[0] != 0x0003: raise SystemExit('bad manifest chunk')
              first_size=struct.unpack_from('<I',m,4)[0]
              if first_size >= len(m): raise SystemExit('manifest has no XML node chunks')
              if 'resources.arsc' not in z.namelist(): raise SystemExit('missing resources.arsc')
              for n in ('classes.dex','classes2.dex','classes3.dex'):
                  if n not in z.namelist(): raise SystemExit('missing '+n)
          PY
          ls -lh rebuilt-app.apk

      - name: Upload usable APK
        uses: actions/upload-artifact@v4
        with:
          name: usable-apk
          path: rebuilt-app.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package recovered source
        run: |
          set -euo pipefail
          cd decompiled
          zip -qr ../decompiled-source.zip .
          cd ..
          ls -lh decompiled-source.zip

      - name: Upload recovered source
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-source
          path: decompiled-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Package ID lock analysis
        if: always()
        run: |
          set -euo pipefail
          cd decompiled
          zip -qr ../id-lock-analysis.zip hermes assets/index.android.bundle 2>/dev/null || true
          cd ..

      - name: Upload ID lock analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: id-lock-analysis
          path: id-lock-analysis.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Publish build result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ARTIFACTS="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" 2>/dev/null)"
          echo "run_id=${GITHUB_RUN_ID}" > build-status.txt
          echo "job_status=${{ job.status }}" >> build-status.txt
          echo "$ARTIFACTS" | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(f"artifact={a[\"name\"]}|id={a[\"id\"]}|size={a[\"size_in_bytes\"]}") for a in d.get("artifacts",[])]' >> build-status.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status.txt
          git commit -m "ci: record APK build result" || true
          git push || true
