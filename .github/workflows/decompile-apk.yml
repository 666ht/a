name: Decompile APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.apk'
      - '**.zip'
      - '.github/workflows/decompile-apk.yml'

jobs:
  decompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip wget zip openjdk-17-jre-headless
          java -version

      - name: Locate or reconstruct APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work/candidates work/reconstructed
          : > work/apk_path.txt

          echo "Repository files:"
          find . -maxdepth 5 -type f -not -path './.git/*' -not -path './work/*' -print | sort

          # 1) Prefer a real APK file.
          while IFS= read -r -d '' f; do
            if unzip -l "$f" 2>/dev/null | grep -qE '(^|[[:space:]])[^[:space:]]*/?AndroidManifest\.xml[[:space:]]*$' &&
               unzip -l "$f" 2>/dev/null | grep -qE '(^|[[:space:]])[^[:space:]]*/?classes([0-9]*)\.dex[[:space:]]*$'; then
              printf '%s\n' "$f" > work/apk_path.txt
              break
            fi
          done < <(find . -type f -iname '*.apk' -not -path './.git/*' -not -path './work/*' -print0)

          # 2) The current repository stores the APK as a ZIP whose contents
          #    are under a directory (123kt/AndroidManifest.xml, classes.dex, ...).
          #    Extract every ZIP and rebuild an APK from the directory that
          #    contains AndroidManifest.xml + classes*.dex.
          if [ ! -s work/apk_path.txt ]; then
            while IFS= read -r -d '' z; do
              base="$(basename "$z")"
              stem="${base%.*}"
              out="work/candidates/$stem"
              rm -rf "$out"
              mkdir -p "$out"
              unzip -q "$z" -d "$out"

              manifest="$(find "$out" -type f -name AndroidManifest.xml -print -quit)"
              if [ -z "$manifest" ]; then
                continue
              fi
              root="$(dirname "$manifest")"

              if find "$root" -maxdepth 1 -type f -regex '.*/classes[0-9]*\.dex' -print -quit | grep -q .; then
                reconstructed="work/reconstructed/recovered.apk"
                rm -f "$reconstructed"
                (
                  cd "$root"
                  zip -q -r "$GITHUB_WORKSPACE/$reconstructed" .
                )
                printf '%s\n' "$reconstructed" > work/apk_path.txt
                echo "Reconstructed APK from: $root"
                break
              fi
            done < <(find . -type f -iname '*.zip' -not -path './.git/*' -not -path './work/*' -print0)
          fi

          if [ ! -s work/apk_path.txt ]; then
            echo "::error::No APK structure found. Expected AndroidManifest.xml and classes*.dex."
            exit 1
          fi

          APK="$(head -n 1 work/apk_path.txt)"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Using APK: $APK"
          unzip -l "$APK" | grep -E 'AndroidManifest\.xml|classes([0-9]*)\.dex' | head -20 || true
          ls -lh "$APK"

      - name: Install JADX
        run: |
          set -euo pipefail
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip -O /tmp/jadx.zip
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx
          sudo chmod +x /opt/jadx/bin/jadx
          /opt/jadx/bin/jadx --version

      - name: Install Apktool
        run: |
          set -euo pipefail
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/v2.9.3/scripts/linux/apktool -O /tmp/apktool
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /tmp/apktool.jar
          sudo install -m 755 /tmp/apktool /usr/local/bin/apktool
          sudo install -m 644 /tmp/apktool.jar /usr/local/bin/apktool.jar
          apktool --version

      - name: Decompile APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf decompiled
          mkdir -p decompiled/jadx decompiled/apktool decompiled/assets

          /opt/jadx/bin/jadx --show-bad-code --deobf -d decompiled/jadx "$APK" || true
          apktool d -f -o decompiled/apktool "$APK" || true

          unzip -p "$APK" assets/index.android.bundle > decompiled/assets/index.android.bundle 2>/dev/null || true
          unzip -p "$APK" assets/app.config > decompiled/assets/app.config 2>/dev/null || true

          printf 'APK=%s\n' "$APK" > decompiled/README.txt
          printf 'Generated by GitHub Actions using JADX and Apktool.\n' >> decompiled/README.txt

      - name: Patch ID lock and rebuild APK
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="decompiled/assets/index.android.bundle"
          if [ ! -f "$BUNDLE" ]; then
            echo "::error::Hermes bundle not found: $BUNDLE"
            exit 1
          fi

          HERMES_URL="https://github.com/SymbioticSec/hermes-decomp/releases/download/v0.2.4/hermes-decomp-v0.2.4-linux-x86_64.tar.gz"
          wget -q "$HERMES_URL" -O /tmp/hermes-decomp.tar.gz
          rm -rf /tmp/hermes-decomp
          mkdir -p /tmp/hermes-decomp
          tar -xzf /tmp/hermes-decomp.tar.gz -C /tmp/hermes-decomp --strip-components=1
          HERMES="/tmp/hermes-decomp/hermes-decomp"
          chmod +x "$HERMES"
          "$HERMES" info "$BUNDLE"

          mkdir -p work
          cat > work/unlock_13267.hasm <<'EOF'
function 13267:
StartGenerator
ResumeGenerator r0, r1
JmpTrue L24, r1
GetEnvironment r1, 2
LoadFromEnvironment r1, r1, 8
LoadConstUndefined r2
Call1 r1, r1, r2
SaveGenerator L18
Ret r1
L18:
ResumeGenerator r1, r3
JmpTrue L21, r3
CompleteGenerator
Ret r2
L21:
CompleteGenerator
Ret r1
L24:
CompleteGenerator
Ret r0
EOF

          "$HERMES" asm-check "$BUNDLE" --function 13267 --input work/unlock_13267.hasm
          "$HERMES" patch-function "$BUNDLE" --function 13267 --hasm work/unlock_13267.hasm -o work/unlocked.bundle
          "$HERMES" disasm work/unlocked.bundle --function 13267 --info --show-offsets > work/unlocked-13267.hasm
          cp work/unlocked.bundle "$BUNDLE"

          rm -rf work/apktool-rebuilt
          apktool b decompiled/apktool -o work/unlocked-unsigned.apk
          test -s work/unlocked-unsigned.apk

          SDK="${ANDROID_HOME:-/opt/android-sdk}"
          ZIPALIGN="$(find "$SDK" -type f -name zipalign -perm -111 2>/dev/null | sort -V | tail -1)"
          APKSIGNER="$(find "$SDK" -type f -name apksigner -perm -111 2>/dev/null | sort -V | tail -1)"
          if [ -z "$ZIPALIGN" ] || [ -z "$APKSIGNER" ]; then
            echo "::error::Android zipalign/apksigner not found"
            exit 1
          fi

          keytool -genkeypair -v \
            -keystore work/test-signing.keystore \
            -storepass android -keypass android \
            -alias testkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=666ht-test,O=666ht,C=JP"
          "$ZIPALIGN" -f 4 work/unlocked-unsigned.apk work/unlocked-aligned.apk
          "$APKSIGNER" sign \
            --ks work/test-signing.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out work/unlocked.apk \
            work/unlocked-aligned.apk
          "$APKSIGNER" verify --verbose work/unlocked.apk
          cp work/unlocked.apk unlocked-id-lock-removed.apk
          ls -lh unlocked-id-lock-removed.apk

      - name: Upload unlocked APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unlocked-apk
          path: unlocked-id-lock-removed.apk
          if-no-files-found: error
          retention-days: 14
      - name: Deep inspect Hermes bundle for ID lock
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="decompiled/assets/index.android.bundle"
          if [ ! -f "$BUNDLE" ]; then
            echo "::warning::Hermes bundle not found: $BUNDLE"
            exit 0
          fi
          python3 -m pip install --no-cache-dir hermes-dec==0.1.7
          mkdir -p decompiled/hermes
          hbc-file-parser "$BUNDLE" > decompiled/hermes/header.txt
          hbc-decompiler "$BUNDLE" decompiled/hermes/app-pseudo.js > decompiled/hermes/decompiler.log 2>&1 || true
          hbc-disassembler "$BUNDLE" decompiled/hermes/app.hasm > decompiled/hermes/disassembler.log 2>&1 || true
          grep -Ein -C 8 'android.?id|device.?id|installation.?id|license|activate|authorization|unlock|locked|serial|uuid|token|c4l39|is.?login|login' decompiled/hermes/app-pseudo.js decompiled/hermes/app.hasm > decompiled/hermes/id-lock-hits.txt || true
          strings "$BUNDLE" | grep -Ei 'android.?id|device.?id|installation.?id|license|activate|authorization|unlock|locked|serial|uuid|token|c4l39|is.?login|login' > decompiled/hermes/string-hits.txt || true

      - name: Decompile Hermes JavaScript bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="decompiled/assets/index.android.bundle"
          if [ ! -f "$BUNDLE" ]; then
            echo "::warning::Hermes bundle not found: $BUNDLE"
            exit 0
          fi
          python3 -m pip install --no-cache-dir hermes-dec==0.1.7
          mkdir -p decompiled/hermes
          hbc-file-parser "$BUNDLE" > decompiled/hermes/header.txt
          hbc-decompiler "$BUNDLE" decompiled/hermes/app-pseudo.js > decompiled/hermes/decompiler.log 2>&1 || true
          hbc-disassembler "$BUNDLE" decompiled/hermes/app.hasm > decompiled/hermes/disassembler.log 2>&1 || true
          strings "$BUNDLE" | grep -Ei 'device|android.?id|installation|client.?id|license|activate|unlock|lock|serial|uuid|secure|authorization|token|http' > decompiled/hermes/suspicious-strings.txt || true

      - name: Record ID-lock code context
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p reports
          REPORT="reports/id-lock-context.txt"
          : > "$REPORT"
          echo "Generated at: $(date -u +%FT%TZ)" >> "$REPORT"
          echo "=== exact lock string ===" >> "$REPORT"
          grep -R -a -n -C 20 'c4l39l0g2dhz0722' decompiled 2>/dev/null | head -120 >> "$REPORT" || true
          echo >> "$REPORT"
          echo "=== likely ID/lock code in smali ===" >> "$REPORT"
          grep -R -n -E -C 12 'android_id|device.?id|installation.?id|license|activate|authorization|unlock|locked|serial|uuid|token|c4l39' decompiled/apktool/smali* 2>/dev/null | head -300 >> "$REPORT" || true
          echo >> "$REPORT"
          echo "=== JADX matches ===" >> "$REPORT"
          grep -R -n -E -C 15 'c4l39|android.?id|device.?id|installation.?id|license|activate|authorization|unlock|locked|serial|uuid' decompiled/jadx 2>/dev/null | head -300 >> "$REPORT" || true
          echo >> "$REPORT"
          echo "=== Hermes matches ===" >> "$REPORT"
          cat decompiled/hermes/id-lock-hits.txt decompiled/hermes/string-hits.txt 2>/dev/null | head -300 >> "$REPORT" || true
          echo >> "$REPORT"
          echo "=== manifest/package ===" >> "$REPORT"
          sed -n '1,220p' decompiled/apktool/AndroidManifest.xml 2>/dev/null >> "$REPORT" || true

      - name: Commit lock analysis context
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/id-lock-context.txt
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "ci: record ID lock code context"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Package recovered source
        run: |
          set -euo pipefail
          cd decompiled
          zip -qr ../decompiled-source.zip .
          cd ..
          ls -lh decompiled-source.zip

      - name: Upload recovered source
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-source
          path: decompiled-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Package ID lock analysis
        if: always()
        run: |
          set -euo pipefail
          cd decompiled
          zip -qr ../id-lock-analysis.zip hermes assets/index.android.bundle 2>/dev/null || true
          cd ..

      - name: Upload ID lock analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: id-lock-analysis
          path: id-lock-analysis.zip
          if-no-files-found: warn
          retention-days: 14
